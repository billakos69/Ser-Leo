<!-- ========== FAN CARD POPUP ========== -->
<div id="popup" class="popup-overlay">
  <div class="popup-content">
    <button class="popup-close" onclick="closePopup()">✕</button>

    <div class="card-3d-container">
      <div class="fan-card">
        <div class="front">
          <img src="images/card1.png" alt="Fan Card Front">
        </div>
        <div class="back">
          <img src="images/CARD2.png" alt="Fan Card Back">
        </div>
      </div>
    </div>

    <h2>Κάρτα Φιλάθλου 2025</h2>
    <p>Απόκτησε τη δική σου επίσημη κάρτα φιλάθλου και στήριξε την ομάδα!</p>
     <a href="product.php?id=31" class="popup-btn">Απόκτησέ τη τώρα</a>
  </div>
</div>

<style>
/* ===== POPUP GENERAL ===== */
.popup-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 9999;
  justify-content: center;
  align-items: center;
}
.popup-content {
  background: #fff;
  color: #222;
  padding: 25px;
  border-radius: 20px;
  max-width: 400px;
  text-align: center;
  position: relative;
  box-shadow: 0 0 25px rgba(0,0,0,0.3);
}
.popup-close {
  position: absolute;
  top: 10px; right: 10px;
  background: #ffc955;
  color: white;
  border: none;
  border-radius: 50%;
  width: 30px; height: 30px;
  font-size: 1.2rem;
  cursor: pointer;
  transition: 0.3s;
}
.popup-close:hover { background: #bc8a31; }

/* ===== BUTTON ===== */
.popup-btn {
  display: inline-block;
  background: linear-gradient(135deg, #bc8a31, rgb(255, 173, 49));
  color: #fff;
  font-weight: bold;
  padding: 10px 20px;
  border-radius: 25px;
  text-decoration: none;
  transition: 0.3s;
}
.popup-btn:hover {
  background: linear-gradient(135deg, #000, rgb(65, 39, 0));
  transform: scale(1.05);
}

/* ===== 3D CARD ===== */
.card-3d-container {
  perspective: 1000px;
  width: 260px;
  height: 160px;
  margin: 0 auto 20px;
}

.fan-card {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: rotateCard 8s linear infinite;
}

.fan-card .front, .fan-card .back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 0 15px rgba(0,0,0,0.3);
}

.fan-card .front img, .fan-card .back img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.fan-card .back {
  transform: rotateY(180deg);
}

/* Animation */
@keyframes rotateCard {
  0% { transform: rotateY(0deg); }
  100% { transform: rotateY(360deg); }
}
</style>

<script>
function openPopup() {
  document.getElementById("popup").style.display = "flex";
}
function closePopup() {
  document.getElementById("popup").style.display = "none";
}

// Μόνο 1 φορά ανά session
window.addEventListener('load', () => {
  if (!sessionStorage.getItem('popupShown')) {
    setTimeout(() => {
      openPopup();
      sessionStorage.setItem('popupShown', 'true');
    }, 200);
  }
});

function goToProduct(id) {
  window.location.href = 'product.php?id=' + id;
}
</script>
